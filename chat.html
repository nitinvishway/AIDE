<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgentSix Chat</title>
  <style>
    :root {
      --bg-primary: #08080c;
      --bg-secondary: rgba(14, 14, 23, 0.7);
      --bg-card: rgba(22, 22, 35, 0.45);
      --bg-input: rgba(15, 15, 25, 0.8);
      --border-color: rgba(255, 255, 255, 0.08);
      --text-primary: #f3f4f6;
      --text-secondary: #9ca3af;
      --accent-glow: #6366f1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: 'Outfit', system-ui, sans-serif;
      overflow: hidden;
    }

    #root {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .chat-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
    }

    .chat-header {
      padding: 16px;
      border-bottom: 1px solid var(--border-color);
      background: var(--bg-secondary);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .chat-header h1 {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      padding: 12px 16px;
      border-radius: 8px;
      max-width: 80%;
      word-wrap: break-word;
    }

    .message.user {
      align-self: flex-end;
      background: var(--accent-glow);
      color: white;
    }

    .message.assistant {
      align-self: flex-start;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
    }

    .chat-input-area {
      padding: 16px;
      border-top: 1px solid var(--border-color);
      background: var(--bg-secondary);
      display: flex;
      gap: 8px;
    }

    .chat-input-area input {
      flex: 1;
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }

    .chat-input-area input:focus {
      border-color: var(--accent-glow);
    }

    .chat-input-area input::placeholder {
      color: var(--text-secondary);
    }

    .chat-input-area button {
      background: var(--accent-glow);
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: opacity 0.2s;
    }

    .chat-input-area button:hover {
      opacity: 0.9;
    }

    .empty-state {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-secondary);
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="chat-container">
      <div class="chat-header">
        <h1>Chat Assistant</h1>
      </div>
      
      <div class="chat-messages" id="messages">
        <div class="empty-state">
          <p>Start a conversation...</p>
        </div>
      </div>

      <div class="chat-input-area">
        <input 
          type="text" 
          id="messageInput" 
          placeholder="Type your message..."
          onkeypress="handleKeyPress(event)"
        >
        <button onclick="sendMessage()">Send</button>
      </div>
    </div>
  </div>

  <script>
    let messages = [];

    function sendMessage() {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      
      if (!text) return;

      // Add user message
      messages.push({ type: 'user', text });
      displayMessages();
      input.value = '';
      
      // Simulate assistant response
      setTimeout(() => {
        messages.push({ type: 'assistant', text: 'Processing: ' + text });
        displayMessages();
      }, 500);
    }

    function displayMessages() {
      const container = document.getElementById('messages');
      const isEmpty = messages.length === 0;
      
      if (isEmpty) {
        container.innerHTML = '<div class="empty-state"><p>Start a conversation...</p></div>';
        return;
      }

      container.innerHTML = messages.map(msg => 
        `<div class="message ${msg.type}">${msg.text}</div>`
      ).join('');
      
      container.scrollTop = container.scrollHeight;
    }

    function handleKeyPress(event) {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    }

    // Focus input on load
    document.getElementById('messageInput').focus();
  </script>
</body>
</html>
